<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="800" height="450" rx="12" fill="#1A1A1B" stroke="#343536" stroke-width="2" />

  <!-- Subreddit Header Banner -->
  <rect x="0" y="0" width="800" height="90" rx="12" fill="#24A0ED" opacity="0.85" />
  
  <!-- Profile Bar -->
  <rect x="30" y="55" width="70" height="70" rx="35" fill="#FF4500" stroke="#1A1A1B" stroke-width="4" />
  <text x="65" y="98" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">O</text>

  <g transform="translate(120, 96)">
    <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">u/oskar_builder</text>
    <text x="170" y="15" fill="#0079D3" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">✓ Permission Confirmed</text>
    <text x="0" y="36" fill="#818384" font-family="-apple-system, sans-serif" font-size="12">Solo SaaS Founder • Building indie dev tools</text>
  </g>

  <!-- Karma Stat Cards -->
  <g transform="translate(40, 160)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#272729" stroke="#343536" />
    <text x="18" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TOTAL KARMA GAINED</text>
    <text x="18" y="64" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">1,420</text>
    <text x="96" y="62" fill="#46D160" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">(from 1 baseline)</text>

    <!-- Box 2 -->
    <rect x="250" y="0" width="220" height="90" rx="8" fill="#272729" stroke="#343536" />
    <text x="268" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">COMMENT KARMA (VALUED)</text>
    <text x="268" y="64" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">1,385</text>
    <text x="350" y="62" fill="#818384" font-family="-apple-system, sans-serif" font-size="11">97.5% helpful replies</text>

    <!-- Box 3 -->
    <rect x="500" y="0" width="220" height="90" rx="8" fill="#272729" stroke="#343536" />
    <text x="518" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">EARLY ADOPTER TRIALS</text>
    <text x="518" y="64" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">150+ Signups</text>
    <text x="518" y="80" fill="#46D160" font-family="-apple-system, sans-serif" font-size="11">First paying subscribers</text>
  </g>

  <!-- Recent Comment Verification Card -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="720" height="135" rx="8" fill="#272729" stroke="#343536" />
    <circle cx="28" cy="28" r="10" fill="#FF4500" />
    <text x="28" y="32" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">r/</text>
    <text x="46" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="12">r/SideProject • 3 weeks ago • Verified Thread Contribution</text>
    <text x="20" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">"Wrote a teardown on handling webhook timeouts in serverless functions..."</text>
    
    <!-- Redacted Private Snippet for Privacy Protection -->
    <text x="20" y="80" fill="#818384" font-family="-apple-system, sans-serif" font-size="12">
      "Full disclosure: I built [Tool Name Blur] to solve this exact issue after wrestling with AWS lambdas..."
    </text>
    <rect x="150" y="68" width="105" height="14" rx="3" fill="#343536" opacity="0.9" />

    <g transform="translate(20, 105)">
      <polygon points="6,2 0,10 4,10 4,16 8,16 8,10 12,10" fill="#FF4500" />
      <text x="18" y="14" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">184 upvotes</text>
      <text x="120" y="14" fill="#818384" font-family="-apple-system, sans-serif" font-size="12">42 replies • 0 moderator flags • 100% organic</text>
    </g>
  </g>
</svg>
