<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="800" height="450" rx="12" fill="#1A1A1B" stroke="#343536" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="60" rx="12" fill="#272729" />
  <circle cx="28" cy="30" r="6" fill="#818384" />
  <circle cx="48" cy="30" r="6" fill="#818384" opacity="0.4" />
  <circle cx="68" cy="30" r="6" fill="#818384" opacity="0.4" />
  <text x="100" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Creator Economy Startup (Stealth) — 30-Day Validation</text>
  <rect x="660" y="18" width="115" height="24" rx="12" fill="#1A1A1B" stroke="#FF4500" />
  <text x="674" y="34" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">STEALTH MODE</text>

  <!-- Metric Badges -->
  <g transform="translate(40, 85)">
