    <text x="268" y="74" fill="#46D160" font-family="-apple-system, sans-serif" font-size="10">Zero post removals</text>

    <rect x="500" y="0" width="220" height="80" rx="8" fill="#272729" stroke="#343536" />
    <text x="518" y="26" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">BETA FEEDBACK SIGNALS</text>
