    <text x="14" y="44" fill="#818384" font-family="-apple-system, sans-serif" font-size="10">Audited 12 subreddits for creator complaints</text>

    <rect x="185" y="0" width="165" height="90" rx="6" fill="#272729" stroke="#343536" />
    <text x="199" y="24" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">W2: Direct Solutions</text>
    <text x="199" y="44" fill="#818384" font-family="-apple-system, sans-serif" font-size="10">Troubleshooting creator hardware &amp; tooling</text>

    <rect x="370" y="0" width="165" height="90" rx="6" fill="#272729" stroke="#343536" />
    <text x="384" y="24" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">W3: Private Invites</text>
    <text x="384" y="44" fill="#818384" font-family="-apple-system, sans-serif" font-size="10">Closed beta tester group of 340+ creators</text>

    <rect x="555" y="0" width="165" height="90" rx="6" fill="#272729" stroke="#343536" />
    <text x="569" y="24" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">W4: Product Roadmap</text>
    <text x="569" y="44" fill="#818384" font-family="-apple-system, sans-serif" font-size="10">Synthesized 48 feature suggestions</text>
