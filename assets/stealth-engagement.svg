    <text x="18" y="58" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">4 Communities</text>
    <text x="18" y="74" fill="#818384" font-family="-apple-system, sans-serif" font-size="10">r/contentcreation, r/podcasting...</text>

    <rect x="250" y="0" width="220" height="80" rx="8" fill="#272729" stroke="#343536" />
    <text x="268" y="26" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ORGANIC DISCUSSIONS</text>
