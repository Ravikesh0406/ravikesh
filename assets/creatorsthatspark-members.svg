<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="800" height="450" rx="12" fill="#1A1A1B" stroke="#343536" stroke-width="2" />

  <!-- Subreddit Header Banner -->
  <rect x="0" y="0" width="800" height="85" rx="12" fill="#FF4500" />
  
  <!-- Subreddit Avatar -->
  <circle cx="65" cy="85" r="38" fill="#1A1A1B" stroke="#343536" stroke-width="3" />
  <circle cx="65" cy="85" r="30" fill="#FF4500" />
  <polygon points="65,65 52,83 60,83 60,98 70,98 70,83 78,83" fill="#FFFFFF" />

  <g transform="translate(120, 96)">
    <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">r/CreatorsThatSpark</text>
    <text x="250" y="15" fill="#46D160" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">● Active Community</text>
    <text x="0" y="38" fill="#818384" font-family="-apple-system, sans-serif" font-size="13">Niche Community Building: From 0 to 1,240+ Highly Active Digital Creators</text>
  </g>

  <!-- Metrics Row -->
  <g transform="translate(40, 165)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="220" height="95" rx="8" fill="#272729" stroke="#343536" />
    <text x="18" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">SUBSCRIBERS</text>
    <text x="18" y="66" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">1,240</text>
    <text x="100" y="64" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Members</text>
    <text x="18" y="86" fill="#46D160" font-family="-apple-system, sans-serif" font-size="11">100% organic founder growth</text>

    <!-- Box 2 -->
    <rect x="250" y="0" width="220" height="95" rx="8" fill="#272729" stroke="#343536" />
    <text x="268" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">WEEKLY UNIQUES</text>
    <text x="268" y="66" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">8,400+</text>
    <text x="268" y="86" fill="#818384" font-family="-apple-system, sans-serif" font-size="11">Recurring weekly visitors</text>

    <!-- Box 3 -->
    <rect x="500" y="0" width="220" height="95" rx="8" fill="#272729" stroke="#343536" />
    <text x="518" y="28" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">CREATOR DISCUSSIONS</text>
    <text x="518" y="66" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">320+</text>
    <text x="518" y="86" fill="#46D160" font-family="-apple-system, sans-serif" font-size="11">Avg 14 comments per thread</text>
