<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1A1A1B" />
      <stop offset="100%" stopColor="#121213" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FF4500" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#FF4500" stopOpacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" rx="12" fill="url(#bgGrad)" stroke="#343536" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="56" rx="12" fill="#272729" />
  <circle cx="28" cy="28" r="6" fill="#FF4500" />
  <circle cx="48" cy="28" r="6" fill="#D7DADC" opacity="0.3" />
  <circle cx="68" cy="28" r="6" fill="#D7DADC" opacity="0.3" />
  <text x="100" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Vilva.ai — Reddit Organic Referral Traffic (30-Day Month Trial)</text>
  <rect x="670" y="16" width="106" height="24" rx="12" fill="#1A1A1B" stroke="#343536" />
  <text x="682" y="32" fill="#0079D3" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Verified UTM</text>

  <!-- Metric Badges -->
  <g transform="translate(40, 80)">
