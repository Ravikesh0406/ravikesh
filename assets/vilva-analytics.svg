    <rect x="0" y="0" width="160" height="64" rx="8" fill="#272729" stroke="#343536" />
    <text x="16" y="24" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TOTAL SESSIONS</text>
    <text x="16" y="50" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">1,557</text>

    <!-- Metric 2 -->
    <rect x="180" y="0" width="160" height="64" rx="8" fill="#272729" stroke="#343536" />
    <text x="196" y="24" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">QUALIFIED TRIALS</text>
    <text x="196" y="50" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">84 Signups</text>

    <!-- Metric 3 -->
    <rect x="360" y="0" width="170" height="64" rx="8" fill="#272729" stroke="#343536" />
    <text x="376" y="24" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">COMMUNITY FLAGS</text>
    <text x="376" y="50" fill="#46D160" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">0 Bans / 0 Flags</text>

    <!-- Metric 4 -->
    <rect x="550" y="0" width="170" height="64" rx="8" fill="#272729" stroke="#343536" />
    <text x="566" y="24" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">CONVERSION RATE</text>
    <text x="566" y="50" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">5.39%</text>
  </g>

  <!-- Grid Lines -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#272729" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="260" x2="740" y2="260" stroke="#272729" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="320" x2="740" y2="320" stroke="#272729" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="380" x2="740" y2="380" stroke="#343536" stroke-width="1.5" />

  <!-- Y-Axis labels -->
  <text x="45" y="204" fill="#818384" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">400</text>
  <text x="45" y="264" fill="#818384" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">200</text>
  <text x="45" y="324" fill="#818384" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">100</text>
  <text x="45" y="384" fill="#818384" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">0</text>

  <!-- Shaded Area Chart -->
  <path d="M 120 370 L 260 345 L 440 250 L 680 185 L 680 380 L 120 380 Z" fill="url(#chartGrad)" />

  <!-- Trend Line -->
  <path d="M 120 370 L 260 345 L 440 250 L 680 185" fill="none" stroke="#FF4500" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data Points -->
  <circle cx="120" cy="370" r="5" fill="#FFFFFF" stroke="#FF4500" stroke-width="3" />
  <circle cx="260" cy="345" r="5" fill="#FFFFFF" stroke="#FF4500" stroke-width="3" />
  <circle cx="440" cy="250" r="5" fill="#FFFFFF" stroke="#FF4500" stroke-width="3" />
  <circle cx="680" cy="185" r="6" fill="#FFFFFF" stroke="#FF4500" stroke-width="3.5" />

  <!-- Point Callouts -->
  <text x="120" y="355" fill="#D7DADC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">42</text>
  <text x="260" y="330" fill="#D7DADC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">185</text>
  <text x="440" y="235" fill="#D7DADC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">410</text>
  <text x="680" y="165" fill="#FF4500" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">920 visits</text>

  <!-- X-Axis Labels -->
  <text x="120" y="405" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Week 1: Setup &amp; Audit</text>
  <text x="260" y="405" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Week 2: First Comments</text>
  <text x="440" y="405" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Week 3: Deep Guides</text>
  <text x="680" y="405" fill="#818384" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Week 4: Retrospective</text>
